name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/palanca
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Palanca.slnx -p:Configuration=Release -p:NuGetAudit=true -p:NuGetAuditMode=all
      - run: dotnet build Palanca.slnx --no-restore --configuration Release
      - run: dotnet test --solution Palanca.slnx --no-build --configuration Release
      - name: Scan repository for vulnerabilities, secrets, and misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # The action's own default is v0.70.0; Dependabot does not bump this, so keep it current by hand.
          version: v0.76.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          timeout: 10m
          cache: false
          skip-dirs: .git
          skip-files: '**/bin/**,**/obj/**'
      # Packing on every run, with package validation, shows packaging problems before a release tag does.
      - name: Pack the client
        run: dotnet pack src/Palanca.Client/Palanca.Client.csproj --no-build --configuration Release --output artifacts/packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-package
          path: artifacts/packages/
          retention-days: 7

  image:
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build image
        run: >-
          docker build --file src/Palanca/Dockerfile
          --tag "$IMAGE:sha-$GITHUB_SHA"
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --label "org.opencontainers.image.revision=$GITHUB_SHA"
          .
      # AC-014: the published image runs as a non-root user and has no shell or package manager.
      - name: Check the image is hardened
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE:sha-$GITHUB_SHA")"
          echo "Image user: $user"
          # USER may name a group after a colon; the user is what runs the app.
          case "${user%%:*}" in
            "" | 0 | root)
              echo "::error::The image runs as root."
              exit 1
              ;;
          esac
          container="$(docker create "$IMAGE:sha-$GITHUB_SHA")"
          docker export "$container" | tar -tf - > "$RUNNER_TEMP/image-files.txt"
          docker rm "$container" > /dev/null
          # A listing that failed would find no shell either; the app itself proves the listing is real.
          if ! grep -qx 'app/Palanca.dll' "$RUNNER_TEMP/image-files.txt"; then
            echo "::error::Could not list the image's files."
            exit 1
          fi
          found="$(grep -E '^(usr/)?(local/)?s?bin/(sh|bash|dash|ash|zsh|ksh|mksh|fish|csh|tcsh|busybox|apt|apt-get|dpkg|rpm|yum|dnf|tdnf|microdnf|zypper|pacman|apk)$' "$RUNNER_TEMP/image-files.txt" || true)"
          if [ -n "$found" ]; then
            echo "::error::The image contains a shell or package manager: $found"
            exit 1
          fi
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # The action's own default is v0.70.0; Dependabot does not bump this, so keep it current by hand.
          version: v0.76.0
          image-ref: ${{ env.IMAGE }}:sha-${{ github.sha }}
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          timeout: 10m
          cache: false
      - name: Save the scanned image for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "$IMAGE:sha-$GITHUB_SHA" | gzip > image.tar.gz
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar.gz
          retention-days: 1
          compression-level: 0

  # Only this job can write packages, and it never runs code from a pull request.
  # It publishes the exact image the scan passed.
  publish:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image
      - run: docker load --input image.tar.gz
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image and record its digest
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")"
          echo "Published \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
